<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173c2c">

  <title>MeatManagement | إدارة اللحوم</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --green: #173c2c;
      --green-light: #24563e;
      --gold: #d5b16a;
      --background: #f4f6f3;
      --white: #fff;
      --text: #202820;
      --muted: #68736a;
      --border: #e0e6df;
      --danger: #a52b2b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Tahoma, sans-serif;
    }

    button, input { font: inherit; }

    button { cursor: pointer; }

    .header {
      background: var(--green);
      color: white;
      padding: 22px 18px;
      border-bottom: 4px solid var(--gold);
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 23px;
    }

    .header p {
      margin: 0;
      font-size: 13px;
      color: #e3eae4;
    }

    .container {
      width: min(100% - 28px, 680px);
      margin: 20px auto 95px;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(20,45,25,.04);
    }

    .card h2 {
      font-size: 19px;
      margin: 0 0 15px;
    }

    .description {
      color: var(--muted);
      line-height: 1.8;
      font-size: 14px;
    }

    label {
      display: block;
      font-size: 14px;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input {
      display: block;
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd5cc;
      border-radius: 10px;
      background: white;
      outline: none;
      direction: ltr;
      text-align: left;
    }

    input:focus {
      border-color: var(--green-light);
    }

    .button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px 15px;
      margin-top: 14px;
      background: var(--green);
      color: white;
      font-weight: bold;
    }

    .button:hover { background: var(--green-light); }

    .button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .button.secondary {
      background: #edf1ed;
      color: var(--green);
      border: 1px solid var(--border);
    }

    .text-button {
      display: block;
      margin: 14px auto 0;
      border: 0;
      background: transparent;
      color: var(--green-light);
      text-decoration: underline;
      padding: 8px;
    }

    .status {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.8;
      overflow-wrap: anywhere;
      background: #f0f3f0;
    }

    .status.success {
      background: #e9f6ec;
      color: #1c6330;
    }

    .status.error {
      background: #fff0f0;
      color: var(--danger);
    }

    .hidden { display: none !important; }

    .user-info {
      background: #e9efe9;
      border-radius: 12px;
      padding: 13px;
      margin-bottom: 15px;
      line-height: 1.8;
      font-size: 14px;
    }

    .product {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px;
      margin-top: 10px;
      background: white;
    }

    .product-name {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 7px;
    }

    .product-details {
      font-size: 13px;
      line-height: 1.9;
      color: var(--muted);
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      margin-top: 5px;
      border-radius: 7px;
      background: #edf1ed;
      font-size: 12px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      right: 0;
      left: 0;
      display: flex;
      justify-content: space-around;
      gap: 5px;
      padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
      background: white;
      border-top: 1px solid var(--border);
    }

    .nav-button {
      flex: 1;
      border: 0;
      background: transparent;
      padding: 8px 3px;
      border-radius: 9px;
      color: var(--muted);
      font-size: 13px;
    }

    .nav-button.active {
      color: var(--green);
      background: #edf3ed;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      padding: 20px 8px;
      color: var(--muted);
      line-height: 1.9;
    }

      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
