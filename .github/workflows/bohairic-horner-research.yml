name: Bohairic Horner NT research extraction

on:
  push:
    paths:
      - "bible/tools/extract_bohairic_horner_usfm.py"
      - ".github/workflows/bohairic-horner-research.yml"
      - "bible/NKJV_BOHAIRIC_EDITION_AUDIT.md"
      - "bible/data/multilingual-edition-registry.draft.json"
  pull_request:
    paths:
      - "bible/tools/extract_bohairic_horner_usfm.py"
      - ".github/workflows/bohairic-horner-research.yml"
      - "bible/NKJV_BOHAIRIC_EDITION_AUDIT.md"
      - "bible/data/multilingual-edition-registry.draft.json"

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download Bohairic USFM
        run: |
          curl -L --fail --retry 3 -o /tmp/copbhc_usfm.zip https://ebible.org/Scriptures/copbhc_usfm.zip
          mkdir -p /tmp/copbhc
          unzip -q /tmp/copbhc_usfm.zip -d /tmp/copbhc

      - name: Inspect downloaded files
        run: |
          find /tmp/copbhc -maxdepth 3 -type f -printf '%p\n' | sort | head -100

      - name: Extract and QA
        run: |
          set +e
          python3 bible/tools/extract_bohairic_horner_usfm.py             --src /tmp/copbhc             --out /tmp/copbhc.jsonl             --audit /tmp/copbhc_audit.json             --archive /tmp/copbhc_usfm.zip
          status=$?
          cat /tmp/copbhc_audit.json
          exit $status

      - name: Upload research candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bohairic-horner-nt-research-candidate
          path: |
            /tmp/copbhc.jsonl
            /tmp/copbhc_audit.json
          retention-days: 14
