name: Bohairic Horner NT research extraction

on:
  push:
    paths:
      - "bible/tools/extract_bohairic_horner_usfm.py"
      - ".github/workflows/bohairic-horner-research.yml"
      - "bible/NKJV_BOHAIRIC_EDITION_AUDIT.md"
      - "bible/data/multilingual-edition-registry.draft.json"

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Bohairic USFM
        run: |
          curl -L --fail --retry 3 -o /tmp/copbhc_usfm.zip https://ebible.org/Scriptures/copbhc_usfm.zip
          mkdir -p /tmp/copbhc
          unzip -q /tmp/copbhc_usfm.zip -d /tmp/copbhc

      - name: Inspect downloaded files
        run: |
          find /tmp/copbhc -maxdepth 3 -type f -printf '%p\n' | sort | head -100

      - name: Extract and QA
        run: |
          python3 bible/tools/extract_bohairic_horner_usfm.py             --src /tmp/copbhc             --out /tmp/copbhc.jsonl             --audit /tmp/copbhc_audit.json             --archive /tmp/copbhc_usfm.zip             --app-out bible/data/cop-bohairic-horner-nt.jsonl.gz
          cat /tmp/copbhc_audit.json
          cp /tmp/copbhc_audit.json bible/data/cop-bohairic-horner-nt_audit.json

      - name: Verify app corpus
        run: |
          python3 - <<'PY'
          import gzip, json
          from pathlib import Path
          path = Path("bible/data/cop-bohairic-horner-nt.jsonl.gz")
          rows = [json.loads(x) for x in gzip.open(path, "rt", encoding="utf-8") if x.strip()]
          assert len(rows) == 7956, len(rows)
          assert len({(r["book_id"], r["chapter"], r["verse"]) for r in rows}) == 7956
          assert len({r["book_id"] for r in rows}) == 27
          assert all(r["text"].strip() for r in rows)
          print("app corpus QA passed", len(rows), "verses")
          PY

      - name: Commit app corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bible/data/cop-bohairic-horner-nt.jsonl.gz bible/data/cop-bohairic-horner-nt_audit.json
          if git diff --cached --quiet; then
            echo "No corpus changes to commit"
            exit 0
          fi
          git commit -m "Add Bohairic Horner NT research corpus"
          git push
