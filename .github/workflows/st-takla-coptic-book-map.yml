name: St-Takla Coptic canon book-ID discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bible/tools/discover_st_takla_book_ids.py"
      - ".github/workflows/st-takla-coptic-book-map.yml"
  pull_request:
    branches: [main]
    paths:
      - "bible/tools/discover_st_takla_book_ids.py"
      - ".github/workflows/st-takla-coptic-book-map.yml"

permissions:
  contents: read

jobs:
  discover-book-ids:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTML parser
        run: python -m pip install beautifulsoup4==4.12.3
      - name: Probe St-Takla book IDs 17 through 50
        run: python bible/tools/discover_st_takla_book_ids.py --first 17 --last 50 --output build/st-takla-book-id-map.jsonl
      - name: Validate probe coverage and preserve research-only status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows = [json.loads(line) for line in Path("build/st-takla-book-id-map.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
          assert len(rows) == 34, f"Expected 34 book-ID observations, got {len(rows)}"
          assert [row["book_number"] for row in rows] == list(range(17, 51))
          assert all(row["status"] in {"PAGE_FOUND", "FETCH_FAILED"} for row in rows)
          assert any(row.get("english_title") == "Tobit" for row in rows), "Tobit not identified"
          assert any(row.get("english_title") == "Judith" for row in rows), "Judith not identified"
          assert any(row.get("english_title") == "Baruch" for row in rows), "Baruch not identified"
          print(f"PASS: {len(rows)} IDs probed; {sum(r['status'] == 'PAGE_FOUND' for r in rows)} pages found")
          for row in rows:
              if row.get("english_title"):
                  print(f'{row["book_number"]}: {row["english_title"]}; chapters up to {row["highest_chapter_link"]}; 1877 marker={row["translation_1877_confirmed_on_page"]}')
          PY
      - name: Upload book-ID map for review
        uses: actions/upload-artifact@v4
        with:
          name: st-takla-coptic-book-id-map
          path: build/st-takla-book-id-map.jsonl
          if-no-files-found: error
          retention-days: 7
