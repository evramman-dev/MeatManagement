name: MeatManagement cloud browser tests

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
  push:
    branches:
      - main
      - qa/full-cycle-test
      - fix/sales-return-retry-idempotency
      - fix/collection-statement-cancelled-status
      - fix/cheque-management-vehicle-trip-guard
      - fix/sales-return-retry-browser-assertion
      - test/sales-invoice-idempotency-coverage

permissions:
  contents: read

concurrency:
  group: meatmanagement-cloud-browser-tests
  cancel-in-progress: false

jobs:
  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
          mkdir -p test-results/sections test-results/role-coverage

      - name: Serve checked-out branch for browser tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory . >/tmp/meatmanagement-http.log 2>&1 &
          echo $! >/tmp/meatmanagement-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              echo "Checked-out branch is available at http://127.0.0.1:4173/"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/meatmanagement-http.log
          exit 1

      - name: Run safe browser checks without production login
        if: github.event_name != 'push' || github.ref != 'refs/heads/main' || vars.QA_LIVE_SMOKE_APPROVED != 'true'
        env:
          BASE_URL: https://evramman-dev.github.io/MeatManagement/
          QA_ROLE_TESTS_SAFE_ENVIRONMENT: ${{ secrets.QA_ROLE_TESTS_SAFE_ENVIRONMENT }}
          QA_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
          QA_SYSTEM_ADMIN_USERNAME: ${{ secrets.QA_SYSTEM_ADMIN_USERNAME }}
          QA_SYSTEM_ADMIN_PASSWORD: ${{ secrets.QA_SYSTEM_ADMIN_PASSWORD }}
          QA_SALES_MANAGER_USERNAME: ${{ secrets.QA_SALES_MANAGER_USERNAME }}
          QA_SALES_MANAGER_PASSWORD: ${{ secrets.QA_SALES_MANAGER_PASSWORD }}
          QA_SALES_REP_USERNAME: ${{ secrets.QA_SALES_REP_USERNAME }}
          QA_SALES_REP_PASSWORD: ${{ secrets.QA_SALES_REP_PASSWORD }}
          QA_WAREHOUSE_KEEPER_USERNAME: ${{ secrets.QA_WAREHOUSE_KEEPER_USERNAME }}
          QA_WAREHOUSE_KEEPER_PASSWORD: ${{ secrets.QA_WAREHOUSE_KEEPER_PASSWORD }}
          QA_PRODUCTION_MANAGER_USERNAME: ${{ secrets.QA_PRODUCTION_MANAGER_USERNAME }}
          QA_PRODUCTION_MANAGER_PASSWORD: ${{ secrets.QA_PRODUCTION_MANAGER_PASSWORD }}
          QA_ACCOUNTANT_USERNAME: ${{ secrets.QA_ACCOUNTANT_USERNAME }}
          QA_ACCOUNTANT_PASSWORD: ${{ secrets.QA_ACCOUNTANT_PASSWORD }}
          QA_GENERAL_MANAGER_USERNAME: ${{ secrets.QA_GENERAL_MANAGER_USERNAME }}
          QA_GENERAL_MANAGER_PASSWORD: ${{ secrets.QA_GENERAL_MANAGER_PASSWORD }}
          PLAYWRIGHT_HTML_OPEN: never
        run: >-
          npx playwright test tests/cloud-smoke.spec.cjs tests/role-coverage.spec.cjs tests/role-coverage-guard.spec.cjs
          --grep-invert "MeatManagement read-only navigation, permissions and session smoke test|MeatManagement Android-sized layout and horizontal overflow check"
          --trace retain-on-failure --reporter=list,html

      - name: Run local Bible corpus browser checks
        if: always()
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: npx playwright test tests/bible-corpus.spec.cjs --trace retain-on-failure --reporter=list

      - name: Run full browser checks only after explicit approval
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.QA_LIVE_SMOKE_APPROVED == 'true'
        env:
          BASE_URL: https://evramman-dev.github.io/MeatManagement/
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          QA_ROLE_TESTS_SAFE_ENVIRONMENT: ${{ secrets.QA_ROLE_TESTS_SAFE_ENVIRONMENT }}
          QA_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
          QA_SYSTEM_ADMIN_USERNAME: ${{ secrets.QA_SYSTEM_ADMIN_USERNAME }}
          QA_SYSTEM_ADMIN_PASSWORD: ${{ secrets.QA_SYSTEM_ADMIN_PASSWORD }}
          QA_SALES_MANAGER_USERNAME: ${{ secrets.QA_SALES_MANAGER_USERNAME }}
          QA_SALES_MANAGER_PASSWORD: ${{ secrets.QA_SALES_MANAGER_PASSWORD }}
          QA_SALES_REP_USERNAME: ${{ secrets.QA_SALES_REP_USERNAME }}
          QA_SALES_REP_PASSWORD: ${{ secrets.QA_SALES_REP_PASSWORD }}
          QA_WAREHOUSE_KEEPER_USERNAME: ${{ secrets.QA_WAREHOUSE_KEEPER_USERNAME }}
          QA_WAREHOUSE_KEEPER_PASSWORD: ${{ secrets.QA_WAREHOUSE_KEEPER_PASSWORD }}
          QA_PRODUCTION_MANAGER_USERNAME: ${{ secrets.QA_PRODUCTION_MANAGER_USERNAME }}
          QA_PRODUCTION_MANAGER_PASSWORD: ${{ secrets.QA_PRODUCTION_MANAGER_PASSWORD }}
          QA_ACCOUNTANT_USERNAME: ${{ secrets.QA_ACCOUNTANT_USERNAME }}
          QA_ACCOUNTANT_PASSWORD: ${{ secrets.QA_ACCOUNTANT_PASSWORD }}
          QA_GENERAL_MANAGER_USERNAME: ${{ secrets.QA_GENERAL_MANAGER_USERNAME }}
          QA_GENERAL_MANAGER_PASSWORD: ${{ secrets.QA_GENERAL_MANAGER_PASSWORD }}
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test tests/cloud-smoke.spec.cjs tests/role-coverage.spec.cjs tests/role-coverage-guard.spec.cjs --trace retain-on-failure --reporter=list,html

      - name: Upload screenshots, traces and HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: meatmanagement-browser-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
