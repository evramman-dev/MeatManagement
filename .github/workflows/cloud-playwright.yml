name: MeatManagement cloud browser tests

on:
  workflow_dispatch:
  push:
    branches:
      - qa/full-cycle-test
      - qa/full-cycle-v108

permissions:
  contents: read

concurrency:
  group: meatmanagement-cloud-browser-tests
  cancel-in-progress: false

jobs:
  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
          mkdir -p test-results/sections

      - name: Run read-only browser tests
        env:
          BASE_URL: https://evramman-dev.github.io/MeatManagement/
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test tests/cloud-smoke.spec.cjs tests/factory-reset-readiness.spec.cjs --trace retain-on-failure --reporter=list,html

      - name: Upload screenshots, traces and HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: meatmanagement-browser-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
