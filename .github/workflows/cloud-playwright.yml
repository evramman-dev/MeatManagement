name: MeatManagement cloud browser tests

on:
  workflow_dispatch:
  push:
    branches:
      - qa/full-cycle-test

permissions:
  contents: read

concurrency:
  group: meatmanagement-cloud-browser-tests
  cancel-in-progress: false

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
          mkdir -p test-results/sections

      - name: Serve the checked-out QA application
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/meatmanagement-qa-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/meatmanagement-qa-server.log
          exit 1

      - name: Run read-only browser tests
        env:
          BASE_URL: http://127.0.0.1:4173/
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test tests/cloud-smoke.spec.cjs --trace retain-on-failure --reporter=list,html

      - name: Upload screenshots, traces and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meatmanagement-browser-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
