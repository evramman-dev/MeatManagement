name: MeatManagement cloud browser tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - qa/full-cycle-test
      - fix/sales-return-retry-idempotency
      - fix/collection-statement-cancelled-status
      - fix/cheque-management-vehicle-trip-guard
      - fix/sales-return-retry-browser-assertion
      - test/sales-invoice-idempotency-coverage

permissions:
  contents: read

concurrency:
  group: meatmanagement-cloud-browser-tests
  cancel-in-progress: false

jobs:
  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
          mkdir -p test-results/sections

      - name: Serve checked-out branch for browser tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory . >/tmp/meatmanagement-http.log 2>&1 &
          echo $! >/tmp/meatmanagement-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              echo "Checked-out branch is available at http://127.0.0.1:4173/"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/meatmanagement-http.log
          exit 1

      - name: Run read-only browser tests
        env:
          BASE_URL: http://127.0.0.1:4173/
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test tests/cloud-smoke.spec.cjs --trace retain-on-failure --reporter=list,html

      - name: Upload screenshots, traces and HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: meatmanagement-browser-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
