name: Prepare and publish Hebrew WLC corpus

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bible/tools/prepare_hebrew_wlc.py"
      - "bible/tools/qa_hebrew_wlc.py"
      - "bible/tools/test_prepare_hebrew_wlc.py"
      - ".github/workflows/prepare-hebrew-wlc.yml"

permissions:
  contents: write

concurrency:
  group: prepare-hebrew-wlc
  cancel-in-progress: true

jobs:
  prepare-qa-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test corpus parsers
        run: python -m unittest discover -s bible/tools -p "test_*.py" -v
      - name: Download and convert WLC source
        run: python bible/tools/prepare_hebrew_wlc.py --output-dir bible/data
      - name: Compare every verse with the source archive
        run: python bible/tools/qa_hebrew_wlc.py
      - name: Record source attribution
        run: |
          cat > bible/data/HEBREW_WLC_SOURCE.md <<'EOF'
          # Hebrew Westminster Leningrad Codex

          Translation ID: HE-WLC-2017
          Edition: Westminster Leningrad Codex, Biblical Hebrew (hboWLC)
          Source download: https://ebible.org/Scriptures/hboWLC_usfm.zip
          Source information: https://ebible.org/find/details.php?id=hboWLC
          Source repository and attribution: https://github.com/openscriptures/morphhb
          License of the WLC biblical text: Public Domain.

          The WLC text itself is public domain. The source package also describes separate lemma and morphology data under CC BY-SA 3.0. This application imports only the Hebrew biblical text and excludes lemma, morphology, and Strong's data.

          The conversion removes USFM structural markers, footnotes, and cross-reference notes. It preserves Hebrew text, vowel points, cantillation, and source verse references. No wording changes are intended.

          Coverage: 39 Masoretic Old Testament books. This edition does not contain the Coptic Orthodox Deuterocanonical books. Their absence is recorded as edition coverage, not as a change to the application's Coptic canon.
          EOF
      - name: Commit verified Hebrew corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bible/data/he-wlc-2017.jsonl.gz bible/data/he-wlc-2017_audit.json bible/data/HEBREW_WLC_SOURCE.md
          git diff --cached --quiet && exit 0
          git commit -m "Bible: add verified Hebrew WLC corpus"
          git push origin HEAD:main
