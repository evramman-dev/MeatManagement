name: Bible source acquisition and corpus staging batch 01

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "bible/data/multilingual-edition-registry.draft.json"
      - "bible/CORPUS_IMPORT_BATCH_01.md"
      - "scripts/fetch_bible_sources.py"
      - "scripts/convert_bible_sources.py"
      - "scripts/tests/test_convert_bible_sources.py"
      - "scripts/audit_bible_corpus.py"
      - "scripts/tests/test_audit_bible_corpus.py"
      - "scripts/convert_coptic_scriptorium_ot.py"
      - "scripts/tests/test_convert_coptic_scriptorium_ot.py"
      - "bible/SOURCE_BATCH_01_BOOK_AUDIT.md"
      - "bible/COPTIC_OT_SOURCE_RESEARCH.md"
      - ".github/workflows/bible-source-acquisition.yml"
  push:
    branches: [main]
    paths:
      - "bible/data/multilingual-edition-registry.draft.json"
      - "bible/CORPUS_IMPORT_BATCH_01.md"
      - "scripts/fetch_bible_sources.py"
      - "scripts/convert_bible_sources.py"
      - "scripts/tests/test_convert_bible_sources.py"
      - "scripts/audit_bible_corpus.py"
      - "scripts/tests/test_audit_bible_corpus.py"
      - "scripts/convert_coptic_scriptorium_ot.py"
      - "scripts/tests/test_convert_coptic_scriptorium_ot.py"
      - "bible/SOURCE_BATCH_01_BOOK_AUDIT.md"
      - "bible/COPTIC_OT_SOURCE_RESEARCH.md"
      - ".github/workflows/bible-source-acquisition.yml"

permissions:
  contents: read

jobs:
  acquire-convert-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Coptic corpus parser dependency
        run: python -m pip install lxml==5.3.0
      - name: Run converter unit tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Download candidate editions and validate archives
        run: python scripts/fetch_bible_sources.py
      - name: Convert editions to separate staged JSONL files
        run: python scripts/convert_bible_sources.py --input build/bible-source-batch-01 --output build/bible-corpus-stage-batch-01
      - name: Audit each edition by book and chapter
        run: python scripts/audit_bible_corpus.py --input build/bible-corpus-stage-batch-01 --catalog bible/data/coptic-canon-catalog.draft.json --manifest build/bible-corpus-stage-batch-01/conversion-manifest.json --output-json build/bible-corpus-stage-batch-01/audit/book-audit.json --output-md build/bible-corpus-stage-batch-01/audit/book-audit.md
      - name: Convert Coptic SCRIPTORIUM OT corpora to research-only JSONL
        run: python scripts/convert_coptic_scriptorium_ot.py --input build/bible-source-batch-01 --catalog bible/data/coptic-canon-catalog.draft.json --output build/bible-coptic-ot-research-batch-01
      - name: Upload Coptic OT research corpus
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bible-coptic-ot-research-batch-01
          path: build/bible-coptic-ot-research-batch-01/
          if-no-files-found: error
          retention-days: 7
      - name: Upload source bundle for review only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bible-source-batch-01
          path: build/bible-source-batch-01/
          if-no-files-found: error
          retention-days: 7
      - name: Upload converted corpus staging bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bible-corpus-stage-batch-01
          path: build/bible-corpus-stage-batch-01/
          if-no-files-found: error
          retention-days: 7
