name: Temporary Coptic corpus mark audit

on:
  push:
    branches:
      - audit/coptic-combining-marks
    paths:
      - ".github/workflows/coptic-mark-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Download the exact published corpus
        run: |
          curl -L --fail --retry 3 -o /tmp/coptic.jsonl.gz https://raw.githubusercontent.com/evramman-dev/MeatManagement/main/bible/data/cop-bohairic-horner-nt.jsonl.gz
      - name: Count Unicode marks in the app corpus
        run: |
          python3 - <<'PY'
          import gzip, json, unicodedata, collections
          rows=[json.loads(x) for x in gzip.open('/tmp/coptic.jsonl.gz','rt',encoding='utf-8') if x.strip()]
          targets={'0300':'combining grave / genkima','0307':'combining dot above','0305':'combining overline','FE24':'combining macron left half','FE25':'combining macron right half','FE26':'combining conjoining macron','0304':'combining macron','0308':'combining diaeresis','0323':'combining dot below','0342':'combining Greek perispomeni','0350':'combining right arrowhead above'}
          counts=collections.Counter()
          all_marks=collections.Counter()
          for row in rows:
              for ch in str(row.get('text','')):
                  cp=f"{ord(ch):04X}"
                  if unicodedata.category(ch) in ('Mn','Mc','Me'): all_marks[cp]+=1
                  if cp in targets: counts[cp]+=1
          print('APP_CORPUS_VERSES',len(rows))
          for cp,name in targets.items(): print('APP',cp,name,counts[cp])
          print('APP_ALL_COMBINING_MARKS',dict(sorted(all_marks.items(),key=lambda x:int(x[0],16))))
          PY
      - name: Download the published DBS Coptic PDF
        run: |
          curl -L --fail --retry 3 -o /tmp/copsnt.pdf https://bibles.dbs.org/COPSNT/pdf/COPSNT.pdf
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdftotext -enc UTF-8 -layout /tmp/copsnt.pdf /tmp/copsnt.txt
      - name: Count Unicode marks in the PDF text layer
        run: |
          python3 - <<'PY'
          import unicodedata, collections
          text=open('/tmp/copsnt.txt',encoding='utf-8').read()
          targets={'0300':'combining grave / genkima','0307':'combining dot above','0305':'combining overline','FE24':'combining macron left half','FE25':'combining macron right half','FE26':'combining conjoining macron','0304':'combining macron','0308':'combining diaeresis','0323':'combining dot below','0342':'combining Greek perispomeni','0350':'combining right arrowhead above'}
          counts=collections.Counter()
          all_marks=collections.Counter()
          for ch in text:
              cp=f"{ord(ch):04X}"
              if unicodedata.category(ch) in ('Mn','Mc','Me'): all_marks[cp]+=1
              if cp in targets: counts[cp]+=1
          print('PDF_TEXT_CHARACTERS',len(text))
          for cp,name in targets.items(): print('PDF',cp,name,counts[cp])
          print('PDF_ALL_COMBINING_MARKS',dict(sorted(all_marks.items(),key=lambda x:int(x[0],16))))
          for needle in ('МАРКОН','ⲘⲀⲢⲔⲞⲚ'):
              pos=text.find(needle)
              if pos>=0: print('PDF_MARK_SAMPLE',repr(text[pos:pos+1400]))
          PY

      - name: Inspect extracted Coptic line structure
        run: |
          python3 - <<'PY'
          import re, unicodedata
          lines=open('/tmp/copsnt.txt',encoding='utf-8').read().splitlines()
          coptic=lambda s:any((0x2C80<=ord(c)<=0x2CFF or 0x0370<=ord(c)<=0x03FF) for c in s)
          marked=lambda s:any(unicodedata.category(c) in ('Mn','Mc','Me') for c in s)
          hits=[(i,line) for i,line in enumerate(lines) if coptic(line) and marked(line)]
          print('LINES_TOTAL',len(lines),'COP_MARKED_LINES',len(hits))
          for i,line in hits[:35]:
              print('PDF_LINE',i,repr(line[:500]))
          print('FIRST_COPTIC_LINES')
          n=0
          for i,line in enumerate(lines):
              if coptic(line):
                  print('PDF_COPTIC_LINE',i,repr(line[:500]))
                  n+=1
                  if n>=25: break
          PY

      - name: Compare PDF reading order with app verses
        run: |
          pdftotext -enc UTF-8 -raw -f 93 -l 95 /tmp/copsnt.pdf /tmp/coptic-raw-sample.txt
          python3 - <<'PY'
          import gzip,json,re,unicodedata
          rows=[json.loads(x) for x in gzip.open('/tmp/coptic.jsonl.gz','rt',encoding='utf-8') if x.strip()]
          print('APP_FIRST_ROWS')
          for r in rows[:12]: print('APP_ROW',repr(r))
          raw=open('/tmp/coptic-raw-sample.txt',encoding='utf-8').read()
          print('PDF_RAW_SAMPLE',repr(raw[:12000]))
          def norm(s):
              return ''.join(c for c in unicodedata.normalize('NFD',s) if (0x2C80<=ord(c)<=0x2CFF or 0x0370<=ord(c)<=0x03FF) and unicodedata.category(c) not in ('Mn','Mc','Me'))
          pdf=norm(raw)
          matched=0
          checked=0
          for r in rows[:300]:
              t=norm(str(r.get('text','')))
              if len(t)>8:
                  checked+=1
                  if t in pdf: matched+=1
          print('FIRST_300_EXACT_NORMALIZED_MATCHES_IN_PDF_SAMPLE',matched,'CHECKED',checked)
          PY

      - name: Locate Matthew text and test verse-level alignment
        run: |
          pdftotext -enc UTF-8 -raw -f 1 -l 12 /tmp/copsnt.pdf /tmp/coptic-matthew-sample.txt
          python3 - <<'PY'
          import gzip,json,unicodedata,re
          rows=[json.loads(x) for x in gzip.open('/tmp/coptic.jsonl.gz','rt',encoding='utf-8') if x.strip()]
          def norm(s):
              s=unicodedata.normalize('NFD',s).upper()
              return ''.join(c for c in s if (0x2C80<=ord(c)<=0x2CFF or 0x0370<=ord(c)<=0x03FF) and unicodedata.category(c) not in ('Mn','Mc','Me'))
          raw=open('/tmp/coptic-matthew-sample.txt',encoding='utf-8').read()
          print('PDF_PAGES_1_TO_12',repr(raw[:18000]))
          pdf=norm(raw)
          for r in rows:
              if r.get('book_id')!='mat': continue
              t=norm(str(r.get('text','')))
              if len(t)>8:
                  print('MAT_VERSE',r.get('chapter'),r.get('verse'),'NORMALIZED',t,'MATCH',t in pdf)
              if r.get('chapter')==1 and r.get('verse')==12: break
          PY

      - name: Diagnose first-verse character alignment
        run: |
          python3 - <<'PY'
          import gzip,json,unicodedata,difflib
          rows=[json.loads(x) for x in gzip.open('/tmp/coptic.jsonl.gz','rt',encoding='utf-8') if x.strip()]
          def norm(s):
              s=unicodedata.normalize('NFD',s).upper()
              return ''.join(c for c in s if (0x2C80<=ord(c)<=0x2CFF or 0x0370<=ord(c)<=0x03FF) and unicodedata.category(c) not in ('Mn','Mc','Me'))
          r=next(x for x in rows if x.get('book_id')=='mat' and x.get('chapter')==1 and x.get('verse')==1)
          app=norm(r['text'])
          raw=open('/tmp/coptic-matthew-sample.txt',encoding='utf-8').read()
          pdf=norm(raw)
          print('APP_FIRST_VERSE_NORMALIZED',app)
          print('PDF_START_NORMALIZED',pdf[:1500])
          print('APP_FIRST_VERSE_IN_PDF_INDEX',pdf.find(app))
          print('APP_FIRST_VERSE_LETTERS',len(app),'PDF_LETTERS',len(pdf))
          for word in norm(r['text']).split(): print('WORD',word,'IN_PDF',word in pdf)
          PY

      - name: Measure full-book source alignment for Matthew
        run: |
          pdftotext -enc UTF-8 -raw -f 5 -l 45 /tmp/copsnt.pdf /tmp/coptic-matthew-book.txt
          python3 - <<'PY'
          import gzip,json,unicodedata,difflib,re
          rows=[json.loads(x) for x in gzip.open('/tmp/coptic.jsonl.gz','rt',encoding='utf-8') if x.strip()]
          def norm(s):
              s=unicodedata.normalize('NFD',s).upper()
              return ''.join(c for c in s if (0x2C80<=ord(c)<=0x2CFF or 0x0370<=ord(c)<=0x03FF) and unicodedata.category(c) not in ('Mn','Mc','Me'))
          app=''.join(norm(str(r.get('text',''))) for r in rows if r.get('book_id')=='mat')
          raw=open('/tmp/coptic-matthew-book.txt',encoding='utf-8').read()
          pdf=norm(raw)
          sm=difflib.SequenceMatcher(None,app,pdf,autojunk=True)
          print('MATTHEW_APP_LETTERS',len(app),'PDF_LETTERS',len(pdf),'SIMILARITY',round(sm.ratio(),5))
          print('MATTHEW_APP_START',app[:350])
          print('MATTHEW_PDF_START',pdf[:350])
          print('LONGEST_MATCH_BLOCKS',[(x.a,x.b,x.size) for x in sorted(sm.get_matching_blocks(),key=lambda x:x.size,reverse=True)[:12]])
          print('PDF_ABBREVIATION_MARKS',[(hex(ord(c)),unicodedata.name(c,'?')) for c in raw if unicodedata.category(c) in ('Mn','Mc','Me')][:60])
          PY

      - name: Inspect original USFM archive for preserved marks
        run: |
          curl -L --fail --retry 3 -o /tmp/copbhc_usfm.zip https://ebible.org/Scriptures/copbhc_usfm.zip
          python3 - <<'PY'
          import zipfile,unicodedata,collections
          z=zipfile.ZipFile('/tmp/copbhc_usfm.zip')
          names=[n for n in z.namelist() if n.lower().endswith('.usfm')]
          counts=collections.Counter()
          samples=collections.defaultdict(list)
          print('USFM_FILE_COUNT',len(names),'NAMES',names[:40])
          for name in names:
              data=z.read(name).decode('utf-8-sig','replace')
              for ch in data:
                  if unicodedata.category(ch) in ('Mn','Mc','Me'): counts[f'{ord(ch):04X}']+=1
              if 'mat' in name.lower():
                  print('USFM_MATTHEW_SAMPLE',repr(data[:7000]))
          print('USFM_COMBINING_MARKS',dict(sorted(counts.items(),key=lambda x:int(x[0],16))))
          PY

      - name: Compare every USFM verse with the published app corpus
        run: |
          python3 - <<'PY'
          import zipfile,re,unicodedata,gzip,json,collections,os
          z=zipfile.ZipFile('/tmp/copbhc_usfm.zip')
          usfm={}
          mark_examples=collections.defaultdict(list)
          for name in [n for n in z.namelist() if n.lower().endswith('.usfm')]:
              data=z.read(name).decode('utf-8-sig','replace')
              book=None; chapter=None; current=None; parts=[]
              def save():
                  if book and chapter and current is not None:
                      usfm[(book,chapter,current)]=' '.join(' '.join(parts).split())
              for line in data.splitlines():
                  m=re.match(r'\\id\s+(\S+)',line)
                  if m: book=m.group(1).lower(); continue
                  m=re.match(r'\\c\s+(\d+)',line)
                  if m: save(); chapter=int(m.group(1)); current=None; parts=[]; continue
                  m=re.match(r'\\v\s+(\d+)(?:-\d+)?\s*(.*)',line)
                  if m: save(); current=int(m.group(1)); parts=[m.group(2)]; continue
                  if current is not None and line.strip() and not line.lstrip().startswith('\\'):
                      parts.append(line.strip())
              save()
              for key,txt in list(usfm.items()):
                  if key[0]==book:
                      for ch in txt:
                          if unicodedata.category(ch) in ('Mn','Mc','Me') and len(mark_examples[f'{ord(ch):04X}'])<6:
                              mark_examples[f'{ord(ch):04X}'].append((key,txt))
          app={}
          for line in gzip.open('/tmp/coptic.jsonl.gz','rt',encoding='utf-8'):
              if line.strip():
                  r=json.loads(line); app[(r['book_id'],int(r['chapter']),int(r['verse']))]=r['text']
          def norm(s):
              s=unicodedata.normalize('NFD',s)
              s=''.join(c for c in s if unicodedata.category(c) not in ('Mn','Mc','Me'))
              return ' '.join(s.upper().split())
          common=set(usfm)&set(app)
          exact=sum(norm(usfm[k])==norm(app[k]) for k in common)
          mismatches=[(k,usfm[k],app[k]) for k in common if norm(usfm[k])!=norm(app[k])]
          print('USFM_VERSE_COUNT',len(usfm),'APP_VERSE_COUNT',len(app),'COMMON_KEYS',len(common))
          print('EXACT_AFTER_MARK_REMOVAL',exact,'MISMATCHES',len(mismatches),'MISSING_FROM_APP',len(set(usfm)-set(app)),'MISSING_FROM_USFM',len(set(app)-set(usfm)))
          print('USFM_MARK_EXAMPLES',dict(mark_examples))
          for x in mismatches[:12]: print('MISMATCH',x)
          PY

      - name: Inspect independent Coptic New Testament source
        run: |
          curl -L --fail --retry 3 -o /tmp/copcnt_usfm.zip https://ebible.org/Scriptures/copcnt_usfm.zip
          python3 - <<'PY'
          import zipfile,unicodedata,collections
          z=zipfile.ZipFile('/tmp/copcnt_usfm.zip')
          names=[n for n in z.namelist() if n.lower().endswith('.usfm')]
          print('COPCNT_FILES',len(names),names[:35])
          marks=collections.Counter()
          for name in names:
              data=z.read(name).decode('utf-8-sig','replace')
              for c in data:
                  if unicodedata.category(c) in ('Mn','Mc','Me'): marks[f'{ord(c):04X}']+=1
              if 'MAT' in name.upper():
                  print('COPCNT_MAT_SAMPLE',repr(data[:8000]))
          print('COPCNT_MARKS',dict(marks))
          PY
