name: St-Takla Word deuterocanonical source probe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/st-takla-word-doc-probe.yml"
      - "bible/tools/extract_st_takla_word_candidates.py"

permissions:
  contents: read

jobs:
  probe-word-downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out parser
        uses: actions/checkout@v4
      - name: Install legacy Word extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y antiword
      - name: Download and extract Word source candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/st-takla-word-probe/raw build/st-takla-word-probe/text
          declare -A urls=(
            [tobit]="https://st-takla.org/Bibles/Arabic-Bible-with-Diacritics/17-Tobit__Deu.doc"
            [judith]="https://st-takla.org/Bibles/Arabic-Bible-with-Diacritics/18-Judith__Deu.doc"
            [esther-additions]="https://st-takla.org/Bibles/Arabic-Bible-with-Diacritics/19-2-Esther-the-rest__Deu.doc"
            [psalm-151]="https://st-takla.org/Bibles/Arabic-Bible-with-Diacritics/21-2-Psalm-151__Deu.doc"
            [wisdom]="https://st-takla.org/Bibles/Arabic-Bible-with-Diacritics/25-Wisdom__Deu.doc"
            [sirach]="https://st-takla.org/Bibles/Arabic-Bible-with-Diacritics/26-Sirach__Deu.doc"
            [baruch]="https://st-takla.org/Bibles/Arabic-Bible-with-Diacritics/30-Baruch__Deu.doc"
            [daniel-additions]="https://st-takla.org/Bibles/Arabic-Bible-with-Diacritics/32-2-Daniel-the-rest__Deu.doc"
            [1-maccabees]="https://st-takla.org/Bibles/Arabic-Bible-with-Diacritics/45-First-Maccabees__Deu.doc"
            [2-maccabees]="https://st-takla.org/Bibles/Arabic-Bible-with-Diacritics/46-Second-Maccabees__Deu.doc"
          )
          for name in "${!urls[@]}"; do
            echo "Downloading $name"
            curl --fail --location --retry 2 --connect-timeout 20 --max-time 90 \
              "${urls[$name]}" -o "build/st-takla-word-probe/raw/$name.doc"
            file "build/st-takla-word-probe/raw/$name.doc"
            antiword "build/st-takla-word-probe/raw/$name.doc" \
              > "build/st-takla-word-probe/text/$name.txt"
          done
      - name: Validate readable Arabic and record checksums
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          root = Path("build/st-takla-word-probe")
          report = []
          for path in sorted((root / "text").glob("*.txt")):
              text = path.read_text(encoding="utf-8", errors="replace")
              arabic = len(re.findall(r"[\u0600-\u06ff]", text))
              assert arabic >= 100, f"{path.name}: no substantial Arabic text"
              raw = root / "raw" / (path.stem + ".doc")
              report.append({
                  "book_file": path.stem,
                  "doc_bytes": raw.stat().st_size,
                  "doc_sha256": hashlib.sha256(raw.read_bytes()).hexdigest(),
                  "arabic_characters": arabic,
                  "extracted_text_bytes": path.stat().st_size,
                  "preview": " ".join(text.split())[:500],
              })
          assert len(report) == 10, f"Expected 10 Word files, got {len(report)}"
          (root / "probe-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          for item in report:
              print(f"PASS {item['book_file']}: {item['doc_bytes']} bytes; {item['arabic_characters']} Arabic characters")
          print("All Word files downloaded and converted for research only.")
          PY
      - name: Parse Word text into separate research-only verse candidates
        run: python bible/tools/extract_st_takla_word_candidates.py --text-dir build/st-takla-word-probe/text --output-dir build/st-takla-word-probe/candidates
      - name: Upload Word source probe
        uses: actions/upload-artifact@v4
        with:
          name: st-takla-word-deuterocanonical-probe
          path: build/st-takla-word-probe/
          if-no-files-found: error
          retention-days: 7
