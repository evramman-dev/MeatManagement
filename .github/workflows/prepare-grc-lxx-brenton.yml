name: Prepare and publish Brenton Greek Septuagint corpus
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bible/tools/prepare_grc_lxx_brenton.py"
      - "bible/tools/qa_grc_lxx_brenton.py"
      - "bible/tools/test_prepare_grc_lxx_brenton.py"
      - ".github/workflows/prepare-grc-lxx-brenton.yml"
permissions:
  contents: write
concurrency:
  group: prepare-grc-lxx-brenton
  cancel-in-progress: true
jobs:
  prepare-qa-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test USFM parser and source book mapping
        run: python -m unittest bible/tools/test_prepare_grc_lxx_brenton.py -v
      - name: Download and prepare Brenton Greek Septuagint
        run: python bible/tools/prepare_grc_lxx_brenton.py --output-dir bible/data
      - name: Compare every source verse
        run: python bible/tools/qa_grc_lxx_brenton.py
      - name: Record source and coverage
        run: |
          cat > bible/data/GRC_LXX_BRENTON_SOURCE.md <<'EOF'
          # Brenton Greek Septuagint 1851
          Translation ID: GRC-LXX-BRENTON-1851
          eBible ID: GRCBRE / grcbrent
          Source information: https://ebible.org/find/details.php?id=grcbrent
          Source USFM: https://ebible.org/Scriptures/grcbrent_usfm.zip
          License: Public Domain, as stated by eBible.
          Compiler: Sir Lancelot C. L. Brenton.
          This is a separate Greek Septuagint edition. The corpus preserves all 52 source books and their source chapter/verse labels. It does not replace or reduce the 73-book Coptic Orthodox navigation catalog.
          Source-only books outside the 73-book navigation catalog are retained as separate edition books: 1 Esdras, 3 and 4 Maccabees, Prayer of Manasseh, Letter of Jeremiah, Susanna, and Bel and the Dragon.
          Esther (ESG) and Greek Daniel (DAG) map to the catalog's stable book IDs while preserving the Brenton source chapter and verse numbering. Susanna and Bel remain separate source-book records; no guessed merging into Daniel is performed.
          The source book EZR is the combined Ezra-Nehemiah (2 Esdras) witness and contains 23 chapters. It has no separate NEH source code. Preserve it as one source book; do not split it between canonical Ezra and Nehemiah without a reviewed alignment.
          No Arabic text is fabricated or copied from another edition. Where an Arabic edition has no matching book, the reader reports that it is unavailable in that edition.
          EOF
      - name: Commit verified corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bible/data/grc-lxx-brenton-1851.jsonl.gz bible/data/grc-lxx-brenton-1851_audit.json bible/data/GRC_LXX_BRENTON_SOURCE.md
          git diff --cached --quiet && exit 0
          git commit -m "Bible: add verified Brenton Greek Septuagint corpus"
          git push origin HEAD:main
