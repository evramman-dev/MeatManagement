name: Validate MeatManagement inline JavaScript

on:
  pull_request:
    paths:
      - index.html
      - scripts/check-inline-js.cjs
      - .github/workflows/validate-index-syntax.yml
      - bible/index.html
      - bible/sw.js
      - bible/data/strongs-ar.json
      - bible/data/original-language-sources.json
      - bible/tools/test_hebrew_arabic_lexicon.cjs
      - bible/tools/qa_coptic_catalog.py
      - bible/data/coptic-canon-catalog.draft.json
  push:
    branches:
      - main
      - feat/coptic-second-version
      - feat/rehla-separate-search-screen-20261128
    paths:
      - index.html
      - scripts/check-inline-js.cjs
      - .github/workflows/validate-index-syntax.yml
      - bible/index.html
      - bible/sw.js
      - bible/data/strongs-ar.json
      - bible/data/original-language-sources.json
      - bible/tools/test_hebrew_arabic_lexicon.cjs
      - bible/tools/qa_coptic_catalog.py
      - bible/data/coptic-canon-catalog.draft.json

permissions:
  contents: read

jobs:
  inline-js-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate inline JavaScript
        run: node scripts/check-inline-js.cjs
      - name: Validate Rehla Hebrew Arabic lexicon
        run: node bible/tools/test_hebrew_arabic_lexicon.cjs
      - name: Validate Coptic Orthodox canon and reader catalog
        run: python bible/tools/qa_coptic_catalog.py
