name: Coptic Prayer of Manasseh research extraction

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "bible/tools/extract_coptic_prayer_manasseh.py"
      - ".github/workflows/coptic-prayer-manasseh-research.yml"

permissions:
  contents: read

jobs:
  extract-prayer-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install parser dependencies
        run: python -m pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Extract and validate complete prayer
        run: python bible/tools/extract_coptic_prayer_manasseh.py build/manasseh-research-candidate.jsonl
      - name: Upload research-only candidate
        uses: actions/upload-artifact@v4
        with:
          name: coptic-prayer-manasseh-research-candidate
          path: build/manasseh-research-candidate.jsonl
          if-no-files-found: error
          retention-days: 7
